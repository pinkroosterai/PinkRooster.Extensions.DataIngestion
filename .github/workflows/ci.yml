name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore PinkRooster.Extensions.DataIngestion.slnx -p:NuGetAuditMode=all
      - run: dotnet build PinkRooster.Extensions.DataIngestion.slnx --no-restore
      - run: dotnet test --solution PinkRooster.Extensions.DataIngestion.slnx --no-build
      - name: Run offline benchmark smoke check
        run: |
          benchmark_dll=benchmarks/PinkRooster.Extensions.DataIngestion.Benchmarks/bin/Debug/net10.0/PinkRooster.Extensions.DataIngestion.Benchmarks.dll
          sudo unshare --net -- runuser -u "$(id -un)" -- "$(command -v dotnet)" "$benchmark_dll" smoke benchmarks/evaluation
      - name: Collect core line coverage
        run: >
          dotnet test --project tests/PinkRooster.Extensions.DataIngestion.Chunkers.Tests/PinkRooster.Extensions.DataIngestion.Chunkers.Tests.csproj
          --no-build --results-directory artifacts/coverage --
          --coverage --coverage-settings tests/coverage.runsettings
          --coverage-output-format cobertura --coverage-output core.cobertura.xml
      - name: Enforce core line coverage
        run: python3 tests/check-core-coverage.py artifacts/coverage
      - name: Collect CodeAnalysis line coverage
        run: >
          dotnet test --project tests/PinkRooster.Extensions.DataIngestion.CodeAnalysis.Tests/PinkRooster.Extensions.DataIngestion.CodeAnalysis.Tests.csproj
          --no-build --results-directory artifacts/coverage-codeanalysis --
          --coverage --coverage-settings tests/coverage-codeanalysis.runsettings
          --coverage-output-format cobertura --coverage-output codeanalysis.cobertura.xml
      - name: Report CodeAnalysis line coverage
        run: python3 tests/report-coverage.py artifacts/coverage-codeanalysis codeanalysis.cobertura.xml
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: core-coverage
          path: |
            artifacts/coverage/**/core.cobertura.xml
            artifacts/coverage-codeanalysis/**/codeanalysis.cobertura.xml
          if-no-files-found: error
