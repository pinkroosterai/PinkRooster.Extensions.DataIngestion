name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PinkRooster.Extensions.DataIngestion.slnx -p:NuGetAuditMode=all
      - run: dotnet build PinkRooster.Extensions.DataIngestion.slnx --no-restore
      - run: dotnet test --solution PinkRooster.Extensions.DataIngestion.slnx --no-build
      - name: Run offline benchmark smoke check
        run: |
          benchmark_dll=benchmarks/PinkRooster.Extensions.DataIngestion.Benchmarks/bin/Debug/net10.0/PinkRooster.Extensions.DataIngestion.Benchmarks.dll
          sudo unshare --net -- runuser -u "$(id -un)" -- "$(command -v dotnet)" "$benchmark_dll" smoke benchmarks/evaluation
      - name: Collect core line coverage
        run: >
          dotnet test --project tests/PinkRooster.Extensions.DataIngestion.Chunkers.Tests/PinkRooster.Extensions.DataIngestion.Chunkers.Tests.csproj
          --no-build --results-directory artifacts/coverage --
          --coverage --coverage-settings tests/coverage.runsettings
          --coverage-output-format cobertura --coverage-output core.cobertura.xml
      - name: Enforce core line coverage
        run: python3 tests/check-core-coverage.py artifacts/coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: artifacts/coverage/**/core.cobertura.xml
          if-no-files-found: error
